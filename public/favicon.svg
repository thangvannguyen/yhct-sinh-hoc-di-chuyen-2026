<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Two DNA strands, 180° out of phase: each crosses the other twice. -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round">
    <g stroke-width="4">
      <path d="M22 10 C22 20 42 20 42 32 C42 44 22 44 22 54"/>
      <path d="M42 10 C42 20 22 20 22 32 C22 44 42 44 42 54"/>
    </g>
    <!-- Base-pair rungs, placed where the strands are furthest apart. -->
    <g stroke-width="3.4" opacity="0.95">
      <line x1="25" y1="16" x2="39" y2="16"/>
      <line x1="22" y1="32" x2="42" y2="32"/>
      <line x1="25" y1="48" x2="39" y2="48"/>
    </g>
  </g>
</svg>
